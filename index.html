<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kongsi Lokasi Anda</title>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button {
      padding: 12px 18px;
      font-size: 17px;
      border-radius: 8px;
      background: #0cb043;
      color: white;
      border: none;
      cursor: pointer;
    }
    #status { margin-top: 15px; font-size: 15px; }
  </style>
</head>

<body>
  <h2>Kongsi Lokasi Anda</h2>
  <p>Tekan butang di bawah untuk benarkan pengambilan lokasi.</p>

  <button id="btn">Benarkan Lokasi</button>
  <p id="status"></p>

<script>
document.getElementById("btn").addEventListener("click", () => {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerText = "Peranti anda tidak menyokong geolokasi.";
    return;
  }

  status.innerText = "Sedang mengambil lokasi...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      status.innerText = "Lokasi berjaya diambil. Membuka WhatsApp...";

      const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
      
      const msg = encodeURIComponent(
        `Lokasi saya:\n` +
        `Latitude: ${lat}\n` +
        `Longitude: ${lon}\n` +
        `Google Maps: ${mapsLink}`
      );

      // ❗ GANTI nombor WhatsApp anda di sini
      const phone = "60142446184";

      const waLink = `https://wa.me/${phone}?text=${msg}`;

      window.location.href = waLink;
    },

    (err) => {
      status.innerText = "Gagal mengambil lokasi: " + err.message;
    },

    { enableHighAccuracy: true, timeout: 20000 }
  );
});
</script>

</body>
</html>
